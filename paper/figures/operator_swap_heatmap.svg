<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<style>
  .title { font-size: 16px; font-weight: bold; fill: #111827; }
  .subtitle { font-size: 12px; fill: #4b5563; }
  .header { font-size: 13px; font-weight: 600; fill: #374151; }
  .row-label { font-size: 14px; font-weight: 600; fill: #1f2937; }
  .bar-text { font-size: 13px; font-weight: bold; fill: #ffffff; }
  .val-text { font-size: 12px; fill: #4b5563; font-weight: 500; }
  .axis-line { stroke: #e5e7eb; stroke-width: 1.5px; }
  .grid-tick { stroke: #f3f4f6; stroke-dasharray: 4,4; stroke-width: 1px; }
</style>
<text x="340.0" y="32" text-anchor="middle" class="title">Doubles Advantage Under Operator Swaps (adv/SD Ratio)</text>
<text x="340.0" y="52" text-anchor="middle" class="subtitle">Global peak occurs under subtraction (adv/SD = 6.15), falsifying arithmetic addition.</text>

<!-- Grid lines -->
<line x1="140" y1="80" x2="140" y2="310" class="axis-line" />
<line x1="220" y1="80" x2="220" y2="310" class="grid-tick" />
<line x1="300" y1="80" x2="300" y2="310" class="grid-tick" />
<line x1="380" y1="80" x2="380" y2="310" class="grid-tick" />
<line x1="460" y1="80" x2="460" y2="310" class="grid-tick" />

<!-- Row 1: Plus -->
<text x="120" y="112" text-anchor="end" class="row-label">plus (+)</text>
<rect x="140" y="90" width="238" height="36" fill="#2563eb" rx="6" />
<text x="366" y="113" text-anchor="end" class="bar-text">+5.22 SD</text>
<text x="388" y="113" class="val-text">(Adv: +0.418, SD: 0.080)</text>

<!-- Row 2: Times -->
<text x="120" y="156" text-anchor="end" class="row-label">times (*)</text>
<rect x="140" y="134" width="111" height="36" fill="#3b82f6" rx="6" />
<text x="239" y="157" text-anchor="end" class="bar-text">+2.43</text>
<text x="261" y="157" class="val-text">(Adv: +0.224, SD: 0.092)</text>

<!-- Row 3: Minus (Highlight peak) -->
<text x="120" y="200" text-anchor="end" class="row-label" fill="#dc2626">minus (-)</text>
<rect x="140" y="178" width="281" height="36" fill="#dc2626" rx="6" />
<text x="409" y="201" text-anchor="end" class="bar-text">+6.15 SD ★</text>
<text x="431" y="201" class="val-text" font-weight="bold" fill="#b91c1c">(Peak! Adv: +0.323, SD: 0.052)</text>

<!-- Row 4: And -->
<text x="120" y="244" text-anchor="end" class="row-label">and</text>
<rect x="140" y="222" width="226" height="36" fill="#2563eb" rx="6" />
<text x="354" y="245" text-anchor="end" class="bar-text">+4.95 SD</text>
<text x="376" y="245" class="val-text">(Adv: +0.469, SD: 0.095)</text>

<!-- Row 5: Then -->
<text x="120" y="288" text-anchor="end" class="row-label">then</text>
<rect x="140" y="266" width="208" height="36" fill="#2563eb" rx="6" />
<text x="336" y="289" text-anchor="end" class="bar-text">+4.56 SD</text>
<text x="358" y="289" class="val-text">(Adv: +0.549, SD: 0.120)</text>

<!-- Axis labels -->
<text x="140" y="330" text-anchor="middle" font-size="11" fill="#9ca3af">0</text>
<text x="220" y="330" text-anchor="middle" font-size="11" fill="#9ca3af">+1.75</text>
<text x="300" y="330" text-anchor="middle" font-size="11" fill="#9ca3af">+3.50</text>
<text x="380" y="330" text-anchor="middle" font-size="11" fill="#9ca3af">+5.25</text>
<text x="460" y="330" text-anchor="middle" font-size="11" fill="#9ca3af">+7.00</text>
</svg>
